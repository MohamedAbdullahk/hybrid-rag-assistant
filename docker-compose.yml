services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hybrid_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/faiss:/app/data/faiss
      - ./data/kg:/app/data/kg
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: hybrid_rag_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=http://hybrid_rag_backend:8000
    depends_on:
      - backend
    restart: unless-stopped